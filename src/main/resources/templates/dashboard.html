<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: cabecalho('Fidelis - Dashboard')}" />
  <body>
    <div class="container">
      <br />
      <div
        class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4"
      >
        <h2 class="mb-0">Olá, <span th:text="${nomeExibicao}"></span>!</h2>
        <div th:replace="~{fragmentos :: botao-logout}" />
      </div>

      <p>
        Perfil:
        <span
          class="badge bg-primary"
          th:if="${usuario.perfil.name() == 'CLINICA'}"
          >Clínica</span
        >
        <span
          class="badge bg-success"
          th:if="${usuario.perfil.name() == 'TUTOR'}"
          >Tutor</span
        >
      </p>

      <hr />

      <div th:if="${usuario.perfil.name() == 'CLINICA'}">
        <h4>Painel da Clínica</h4>
        <a th:href="@{/clinica/pets}" class="btn btn-outline-primary"
          >Gerenciar Pets</a
        >

        <div
          th:if="${qtdPetsEmRisco != null and qtdPetsEmRisco > 0}"
          class="alert alert-warning mt-3"
        >
          ⚠️ <b th:text="${qtdPetsEmRisco}"></b> pet(s) sem consulta há mais de
          90 dias.
          <a
            th:href="@{/clinica/retencao}"
            class="btn btn-sm btn-outline-dark ms-2"
            >Ver detalhes</a
          >
        </div>
        <div
          th:if="${qtdPetsEmRisco != null and qtdPetsEmRisco == 0}"
          class="alert alert-success mt-3"
        >
          ✅ Nenhum pet em risco de retenção no momento.
        </div>
      </div>

      <div th:if="${usuario.perfil.name() == 'TUTOR'}">
        <h4>Meus Pets</h4>
        <a th:href="@{/tutor/pets}" class="btn btn-outline-success"
          >Ver Meus Pets</a
        >
      </div>
    </div>

    <script th:replace="~{fragmentos :: bootstrap-script}" />
  </body>
</html>
