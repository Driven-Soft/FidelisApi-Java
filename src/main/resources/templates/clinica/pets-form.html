<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: cabecalho('Fidelis - Cadastro de Pet')}" />
  <body>
    <div class="container" style="max-width: 500px">
      <br />
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom pb-2 mb-3"
      >
        <h2
          class="mb-0"
          th:text="${petId} != null ? 'Editar Pet' : 'Novo Pet'"
        ></h2>
        <div th:replace="~{fragmentos :: botao-logout}" />
      </div>

      <div class="d-flex justify-content-end mb-3">
        <a href="/clinica/pets" class="btn btn-outline-secondary"
          >&larr; Voltar aos pets</a
        >
      </div>

      <form
        th:action="${petId} != null ? @{/clinica/pets/{id}(id=${petId})} : @{/clinica/pets}"
        th:object="${petRequest}"
        method="post"
      >
        <div class="mb-2">
          <label class="form-label" for="nome">Nome</label>
          <input
            class="form-control"
            type="text"
            th:field="*{nome}"
            required
            minlength="3"
            maxlength="30"
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('nome')}"
            th:errors="*{nome}"
          ></span>
        </div>

        <div class="mb-2">
          <label class="form-label" for="especie">Espécie</label>
          <select class="form-control" th:field="*{especie}" required>
            <option value="">Selecione a espécie</option>
            <option
              th:each="e : ${especies}"
              th:value="${e.nome}"
              th:text="${e.nome}"
              th:attr="data-grupo=${e.grupo}"
            ></option>
          </select>
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('especie')}"
            th:errors="*{especie}"
          ></span>
        </div>

        <div
          th:replace="~{fragmentos :: combo-opcoes('raca', 'Raça', ${racas}, 'especie')}"
        />

        <div class="mb-2">
          <label class="form-label" for="sexo">Sexo</label>
          <select class="form-control" th:field="*{sexo}" required>
            <option
              th:each="s : ${T(br.com.fiap.java.FidelisApi.entity.SexoPet).values()}"
              th:value="${s.name()}"
              th:text="${s.rotulo}"
            ></option>
          </select>
        </div>

        <div class="mb-2">
          <label class="form-label" for="dataNascimento"
            >Data de nascimento</label
          >
          <input
            class="form-control"
            type="date"
            th:field="*{dataNascimento}"
            th:attr="min=${petRequest.especie == 'Gato' ? dataMinimaNascimentoGato : dataMinimaNascimentoCachorro},max=${dataMaximaNascimento},data-min-cachorro=${dataMinimaNascimentoCachorro},data-min-gato=${dataMinimaNascimentoGato}"
            required
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('dataNascimento')}"
            th:errors="*{dataNascimento}"
          ></span>
        </div>

        <div class="mb-2">
          <label class="form-label" for="pesoKg">Peso (kg, opcional)</label>
          <input
            class="form-control"
            type="number"
            th:field="*{pesoKg}"
            th:attr="min=${petId == null ? (petRequest.especie == 'Gato' ? pesoMinimoGato : pesoMinimoCachorro) : '0.01'},max=${petId == null ? (petRequest.especie == 'Gato' ? pesoMaximoGato : pesoMaximoCachorro) : null},data-min-gato=${petId == null ? pesoMinimoGato : null},data-min-cachorro=${petId == null ? pesoMinimoCachorro : null},data-max-gato=${petId == null ? pesoMaximoGato : null},data-max-cachorro=${petId == null ? pesoMaximoCachorro : null}"
            step="0.01"
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('pesoKg')}"
            th:errors="*{pesoKg}"
          ></span>
        </div>

        <div class="mb-2">
          <label class="form-label" for="status">Status</label>
          <select class="form-control" th:field="*{status}" required>
            <option
              th:each="s : ${T(br.com.fiap.java.FidelisApi.entity.PetStatus).values()}"
              th:value="${s}"
              th:text="${s}"
            ></option>
          </select>
        </div>

        <div class="mb-2">
          <label class="form-label" for="tutorId">Tutor</label>
          <select class="form-control" th:field="*{tutorId}" required>
            <option
              value=""
              th:each="t : ${tutores}"
              th:value="${t.id}"
              th:text="${t.nome}"
            ></option>
          </select>
        </div>

        <br />
        <button type="submit" class="btn btn-primary">Salvar</button>
      </form>
    </div>

    <script th:replace="~{fragmentos :: bootstrap-script}" />
    <script th:replace="~{fragmentos :: combo-script}" />
    <script>
      const especieInput = document.getElementById("especie");
      const nascimentoInput = document.getElementById("dataNascimento");
      const pesoInput = document.getElementById("pesoKg");
      const cadastroInicial = pesoInput.dataset.maxGato !== undefined;

      function atualizarDataMinimaNascimento() {
        const especie = especieInput.value.toLowerCase();
        nascimentoInput.min =
          especie === "gato"
            ? nascimentoInput.dataset.minGato
            : nascimentoInput.dataset.minCachorro;
      }

      especieInput.addEventListener("change", atualizarDataMinimaNascimento);
      atualizarDataMinimaNascimento();

      function atualizarLimitesPeso() {
        if (!cadastroInicial) {
          return;
        }
        const gato = especieInput.value.toLowerCase() === "gato";
        pesoInput.min = gato
          ? pesoInput.dataset.minGato
          : pesoInput.dataset.minCachorro;
        pesoInput.max = gato
          ? pesoInput.dataset.maxGato
          : pesoInput.dataset.maxCachorro;
      }

      especieInput.addEventListener("change", atualizarLimitesPeso);
      atualizarLimitesPeso();
    </script>
  </body>
</html>
