<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: cabecalho('Fidelis - Vacinações do Pet')}" />
  <body>
    <div class="container">
      <br />
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom pb-2 mb-3"
      >
        <h2 class="mb-0">Vacinações de <span th:text="${pet.nome}"></span></h2>
        <div th:replace="~{fragmentos :: botao-logout}" />
      </div>

      <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
        <a href="/clinica/pets" class="btn btn-outline-secondary"
          >&larr; Voltar aos pets</a
        >
        <a
          th:href="@{/clinica/vacinacoes/nova(petId=${pet.id})}"
          class="btn btn-primary"
          >+ Registrar vacinação</a
        >
      </div>

      <div
        class="alert alert-success"
        th:if="${param.sucesso != null}"
        th:text="${param.sucesso[0] == 'excluida'} ? 'Vacinação excluída com sucesso.' : 'Vacinação atualizada com sucesso.'"
      ></div>

      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Vacina</th>
              <th>Aplicação</th>
              <th>Próxima dose</th>
              <th>Veterinário</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="v : ${vacinacoes}">
              <td th:text="${v.vacinaAplicada}"></td>
              <td
                th:text="${#temporals.format(v.dataAplicacao, 'dd/MM/yyyy')}"
              ></td>
              <td
                th:text="${v.dataProxima != null ? #temporals.format(v.dataProxima, 'dd/MM/yyyy') : '-'}"
              ></td>
              <td th:text="${v.veterinario.nome}"></td>
              <td class="text-end text-nowrap">
                <a
                  class="btn btn-sm btn-outline-secondary"
                  th:href="@{/clinica/vacinacoes/{id}/editar(id=${v.id})}"
                  title="Editar"
                  aria-label="Editar vacinação"
                  ><i class="bi bi-pencil-square"></i
                ></a>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-danger"
                  title="Excluir"
                  aria-label="Excluir vacinação"
                  data-bs-toggle="modal"
                  data-bs-target="#modalExclusao"
                  th:attr="data-exclusao-acao=@{/clinica/vacinacoes/{id}/excluir(id=${v.id})},data-exclusao-texto=${'Excluir a vacinação ' + v.vacinaAplicada + ' aplicada em ' + #temporals.format(v.dataAplicacao, 'dd/MM/yyyy') + '?'}"
                >
                  <i class="bi bi-x-lg"></i>
                </button>
              </td>
            </tr>
            <tr th:if="${vacinacoes.isEmpty()}">
              <td colspan="5">Nenhuma vacinação registrada para este pet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div th:replace="~{fragmentos :: modal-exclusao}" />
    <script th:replace="~{fragmentos :: bootstrap-script}" />
    <script th:replace="~{fragmentos :: exclusao-script}" />
  </body>
</html>
