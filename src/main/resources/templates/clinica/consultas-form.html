<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: cabecalho('Fidelis - Consulta')}" />
  <body>
    <div class="container" style="max-width: 500px">
      <br />
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom pb-2 mb-3"
      >
        <h2
          class="mb-0"
          th:text="${consultaId} != null ? 'Editar Consulta' : 'Registrar Consulta'"
        ></h2>
        <div th:replace="~{fragmentos :: botao-logout}" />
      </div>

      <div class="d-flex justify-content-end mb-3">
        <a
          th:href="${consultaId} != null ? @{/clinica/consultas/pet/{id}(id=${consultaRequest.petId})} : @{/clinica/pets}"
          class="btn btn-outline-secondary"
          th:text="${consultaId} != null ? '← Voltar às consultas' : '← Voltar aos pets'"
        ></a>
      </div>

      <form
        th:action="${consultaId} != null ? @{/clinica/consultas/{id}(id=${consultaId})} : @{/clinica/consultas}"
        th:object="${consultaRequest}"
        method="post"
      >
        <div class="mb-2" th:if="${consultaId == null}">
          <label class="form-label" for="petId">Pet</label>
          <select class="form-control" th:field="*{petId}" required>
            <option
              th:each="p : ${pets}"
              th:value="${p.id}"
              th:text="${p.nome} + ' (' + ${p.tutor.nome} + ')'"
            ></option>
          </select>
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('petId')}"
            th:errors="*{petId}"
          ></span>
        </div>

        <div class="mb-2" th:if="${consultaId != null}">
          <label class="form-label">Pet</label>
          <input
            class="form-control"
            type="text"
            th:value="${petNome}"
            disabled
          />
          <input type="hidden" th:field="*{petId}" />
        </div>

        <div class="mb-2">
          <label class="form-label" for="veterinarioId">Veterinário</label>
          <select class="form-control" th:field="*{veterinarioId}" required>
            <option
              th:each="v : ${veterinarios}"
              th:value="${v.id}"
              th:text="${v.nome}"
            ></option>
          </select>
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('veterinarioId')}"
            th:errors="*{veterinarioId}"
          ></span>
        </div>

        <div
          class="mb-2"
          data-data-hora
          th:attr="data-minimo-hoje=${consultaId == null}"
        >
          <label class="form-label" for="dataHoraData">Data e hora</label>
          <div class="row g-2">
            <div class="col-7">
              <input
                class="form-control"
                type="date"
                id="dataHoraData"
                data-data-hora-data
                required
              />
            </div>
            <div class="col-5">
              <select
                class="form-control"
                aria-label="Horário"
                data-data-hora-hora
                required
              ></select>
            </div>
          </div>
          <input type="hidden" th:field="*{dataHora}" data-data-hora-valor />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('dataHora')}"
            th:errors="*{dataHora}"
          ></span>
        </div>

        <div
          th:replace="~{fragmentos :: combo-opcoes('tipo', 'Tipo', ${tiposConsulta}, '')}"
        />

        <div class="mb-2">
          <label class="form-label" for="diagnostico">Diagnóstico</label>
          <textarea
            class="form-control"
            th:field="*{diagnostico}"
            maxlength="500"
          ></textarea>
        </div>

        <div class="mb-2">
          <label class="form-label" for="observacoes">Observações</label>
          <textarea
            class="form-control"
            th:field="*{observacoes}"
            maxlength="500"
          ></textarea>
        </div>

        <div class="mb-2">
          <label class="form-label" for="dataRetorno"
            >Data de retorno (opcional — se não preencher, gera lembrete em 30
            dias)</label
          >
          <input
            class="form-control"
            type="date"
            th:field="*{dataRetorno}"
            th:attr="min=${dataMinimaRetorno}"
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('dataRetorno')}"
            th:errors="*{dataRetorno}"
          ></span>
        </div>

        <br />
        <button
          type="submit"
          class="btn btn-primary"
          th:text="${consultaId} != null ? 'Salvar alterações' : 'Registrar Consulta'"
        ></button>
      </form>
    </div>

    <script th:replace="~{fragmentos :: bootstrap-script}" />
    <script th:replace="~{fragmentos :: combo-script}" />
    <script th:src="@{/js/data-hora.js}"></script>
  </body>
</html>
