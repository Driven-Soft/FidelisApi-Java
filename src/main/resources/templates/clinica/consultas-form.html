<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragmentos :: cabecalho('Fidelis - Registrar Consulta')}"
  />
  <body>
    <div class="container" style="max-width: 500px">
      <br />
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom pb-2 mb-3"
      >
        <h2 class="mb-0">Registrar Consulta</h2>
        <div th:replace="~{fragmentos :: botao-logout}" />
      </div>

      <div class="d-flex justify-content-end mb-3">
        <a href="/clinica/pets" class="btn btn-outline-secondary"
          >&larr; Voltar aos pets</a
        >
      </div>

      <form
        th:action="@{/clinica/consultas}"
        th:object="${consultaRequest}"
        method="post"
      >
        <div class="mb-2">
          <label>Pet</label>
          <select class="form-control" th:field="*{petId}">
            <option
              th:each="p : ${pets}"
              th:value="${p.id}"
              th:text="${p.nome} + ' (' + ${p.tutor.nome} + ')'"
            ></option>
          </select>
        </div>

        <div class="mb-2">
          <label>Veterinário</label>
          <select class="form-control" th:field="*{veterinarioId}">
            <option
              th:each="v : ${veterinarios}"
              th:value="${v.id}"
              th:text="${v.nome}"
            ></option>
          </select>
        </div>

        <div class="mb-2">
          <label>Data e hora</label>
          <input
            class="form-control"
            type="datetime-local"
            th:field="*{dataHora}"
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('dataHora')}"
            th:errors="*{dataHora}"
          ></span>
        </div>

        <div class="mb-2">
          <label>Tipo</label>
          <input
            class="form-control"
            type="text"
            th:field="*{tipo}"
            placeholder="Ex: Checkup, Vacinação, Emergência"
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('tipo')}"
            th:errors="*{tipo}"
          ></span>
        </div>

        <div class="mb-2">
          <label>Diagnóstico</label>
          <textarea class="form-control" th:field="*{diagnostico}"></textarea>
        </div>

        <div class="mb-2">
          <label>Observações</label>
          <textarea class="form-control" th:field="*{observacoes}"></textarea>
        </div>

        <div class="mb-2">
          <label
            >Data de retorno (opcional — se não preencher, gera lembrete em 30
            dias)</label
          >
          <input class="form-control" type="date" th:field="*{dataRetorno}" />
        </div>

        <br />
        <button type="submit" class="btn btn-primary">
          Registrar Consulta
        </button>
      </form>
    </div>

    <script th:replace="~{fragmentos :: bootstrap-script}" />
  </body>
</html>
