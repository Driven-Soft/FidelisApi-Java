<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Fidelis - Pets')}" />
<body>
    <div th:replace="~{fragmentos :: funcao-logout}" />

    <div class="container">
        <br><br>
        <a href="/dashboard">&larr; Voltar ao dashboard</a>
        <h2>Pets da Clínica</h2>

        <a th:href="@{/clinica/pets/novo}" class="btn btn-primary mb-3">+ Novo Pet</a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Espécie</th>
                    <th>Raça</th>
                    <th>Tutor</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pet : ${pets}">
                    <td th:text="${pet.nome}"></td>
                    <td th:text="${pet.especie}"></td>
                    <td th:text="${pet.raca}"></td>
                    <td th:text="${pet.tutor.nome}"></td>
                    <td th:text="${pet.status}"></td>
                    <td>
                        <a th:href="@{/clinica/consultas/nova(petId=${pet.id})}">Registrar Consulta</a> | <a th:href="@{/clinica/pets/{id}/editar(id=${pet.id})}">Editar</a>
                    </td>
                </tr>
                <tr th:if="${pets.isEmpty()}">
                    <td colspan="6">Nenhum pet cadastrado ainda.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:replace="~{fragmentos :: bootstrap-script}" />
</body>
</html>
