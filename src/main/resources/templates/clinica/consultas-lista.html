<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: cabecalho('Fidelis - Consultas do Pet')}" />
  <body>
    <div class="container">
      <br />
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom pb-2 mb-3"
      >
        <h2 class="mb-0">Consultas de <span th:text="${pet.nome}"></span></h2>
        <div th:replace="~{fragmentos :: botao-logout}" />
      </div>

      <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
        <a href="/clinica/pets" class="btn btn-outline-secondary"
          >&larr; Voltar aos pets</a
        >
        <a
          th:href="@{/clinica/consultas/nova(petId=${pet.id})}"
          class="btn btn-primary"
          >+ Registrar consulta</a
        >
      </div>

      <div
        class="alert alert-success"
        th:if="${param.sucesso != null}"
        th:text="${param.sucesso[0] == 'excluida'} ? 'Consulta excluída com sucesso.' : 'Consulta atualizada com sucesso.'"
      ></div>

      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Data</th>
              <th>Tipo</th>
              <th>Veterinário</th>
              <th>Diagnóstico</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c : ${consultas}">
              <td
                th:text="${#temporals.format(c.dataHora, 'dd/MM/yyyy HH:mm')}"
              ></td>
              <td th:text="${c.tipo}"></td>
              <td th:text="${c.veterinario.nome}"></td>
              <td th:text="${c.diagnostico}"></td>
              <td class="text-end text-nowrap">
                <a
                  class="btn btn-sm btn-outline-secondary"
                  th:href="@{/clinica/consultas/{id}/editar(id=${c.id})}"
                  title="Editar"
                  aria-label="Editar consulta"
                  ><i class="bi bi-pencil-square"></i
                ></a>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-danger"
                  title="Excluir"
                  aria-label="Excluir consulta"
                  data-bs-toggle="modal"
                  data-bs-target="#modalExclusao"
                  th:attr="data-exclusao-acao=@{/clinica/consultas/{id}/excluir(id=${c.id})},data-exclusao-texto=${'Excluir a consulta de ' + c.tipo + ' em ' + #temporals.format(c.dataHora, 'dd/MM/yyyy HH:mm') + '?'}"
                >
                  <i class="bi bi-x-lg"></i>
                </button>
              </td>
            </tr>
            <tr th:if="${consultas.isEmpty()}">
              <td colspan="5">Nenhuma consulta registrada para este pet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div th:replace="~{fragmentos :: modal-exclusao}" />
    <script th:replace="~{fragmentos :: bootstrap-script}" />
    <script th:replace="~{fragmentos :: exclusao-script}" />
  </body>
</html>
