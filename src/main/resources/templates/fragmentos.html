<head th:fragment="cabecalho(titulo)">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="icon"
    type="image/svg+xml"
    th:href="@{/images/fidelis-favicon.svg}"
  />

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" th:href="@{/css/fidelis.css}" />

  <title th:text="${titulo}"></title>
</head>

<script
  th:fragment="bootstrap-script"
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW"
  crossorigin="anonymous"
></script>

<div th:fragment="funcao-logout" class="container">
  <div class="d-flex justify-content-end align-items-center border-bottom py-2">
    <div th:replace="~{fragmentos :: botao-logout}" />
  </div>
</div>

<form
  th:fragment="botao-logout"
  th:action="@{/logout}"
  method="post"
  class="mb-0"
>
  <button type="submit" class="btn btn-outline-danger">Sair da conta</button>
</form>

<script th:fragment="combo-script" th:src="@{/js/combo-opcoes.js}"></script>

<script
  th:fragment="exclusao-script"
  th:src="@{/js/confirmar-exclusao.js}"
></script>

<div
  th:fragment="modal-exclusao"
  class="modal fade"
  id="modalExclusao"
  tabindex="-1"
  aria-labelledby="modalExclusaoTitulo"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalExclusaoTitulo">
          Confirmar exclusão
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Fechar"
        ></button>
      </div>
      <div class="modal-body">
        <p class="mb-1" data-exclusao-mensagem>Deseja excluir este registro?</p>
        <p class="text-danger mb-0">Esta ação não pode ser desfeita.</p>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline-secondary"
          data-bs-dismiss="modal"
        >
          Cancelar
        </button>
        <form
          th:action="@{/}"
          method="post"
          class="mb-0"
          data-exclusao-form
        >
          <button type="submit" class="btn btn-danger">Excluir</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div
  th:fragment="combo-opcoes(campo, rotulo, opcoes, dependeDe)"
  class="mb-2"
  data-combo
  th:attr="data-depende-de=${dependeDe}"
>
  <label class="form-label" th:for="${campo}" th:text="${rotulo}">Rótulo</label>
  <select
    class="form-control d-none"
    data-combo-select
    th:attr="aria-label=${rotulo}"
  >
    <option value="">Selecione uma opção</option>
    <option
      th:each="o : ${opcoes}"
      th:value="${o.nome}"
      th:text="${o.nome}"
      th:attr="data-grupo=${o.grupo}"
    ></option>
    <option value="#outro">Outro (digitar)</option>
  </select>
  <input
    class="form-control mt-2"
    type="text"
    th:field="*{__${campo}__}"
    placeholder="Digite outro valor"
    minlength="3"
    maxlength="50"
    required
    data-combo-input
  />
  <span
    class="text-danger"
    th:if="${#fields.hasErrors(campo)}"
    th:errors="*{__${campo}__}"
  ></span>
</div>
