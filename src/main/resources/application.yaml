spring:
  application:
    name: FidelisApi
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
        temperature: 0.2
  jackson: {}
  datasource:
    url: jdbc:h2:mem:fidelisdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: simple
fidelis:
  analise:
    ia:
      enabled: ${FIDELIS_AI_ENABLED:false}
server:
  port: ${PORT:8080}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
